# ============================================================
# Asadiya Flotte PRO — Docker Compose (production-ready)
#
# Démarrage :
#   cp .env.docker.example .env.docker
#   # générez un JWT_SECRET aléatoire (openssl rand -hex 32)
#   docker compose --env-file .env.docker up -d --build
#
# Les variables du fichier .env.docker sont utilisées à la fois
# pour l'interpolation (${...}) et injectées dans le conteneur app
# (env_file). DATABASE_URL est reconstruit ci-dessous pour pointer
# vers le service « db » (le réseau dédié est utilisé).
# ============================================================

services:
  # ---- PostgreSQL persistant ----
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asadiya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asadiya_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-asadiya_flotte}
    volumes:
      # Volume nommé : les données survivent aux redémarrages / rebuilds.
      - pgdata:/var/lib/postgresql/data
    networks:
      - asadiya_net
    healthcheck:
      # -h 127.0.0.1 force une vérification TCP (et non le socket Unix) :
      # pendant l'init, PostgreSQL peut accepter sur le socket avant que le
      # port 5432 n'écoute — ce qui faisait démarrer `app` trop tôt (ECONNREFUSED).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-asadiya} -d ${POSTGRES_DB:-asadiya_flotte}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---- Application Node.js (API + frontend statique) ----
  app:
    build: .
    image: asadiya-flotte-pro-backend:latest
    restart: unless-stopped
    # Tini comme PID 1 : signaux correctement transmis à Node (arrêt propre)
    # et récolte des processus zombies.
    init: true
    # Délai laissé au serveur pour fermer proprement les connexions (SIGTERM).
    stop_grace_period: 20s
    depends_on:
      db:
        # L'application ne démarre qu'une fois PostgreSQL prêt
        # (pg_isready OK). Les migrations tournent ensuite dans server.js.
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      # Par défaut production, cohérent avec le Dockerfile : jamais laisser
      # une instance de production démarrer en mode développement par oubli.
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4000}
      # Pointe vers le service db du réseau dédié (remplace toute valeur
      # DATABASE_URL locale éventuelle du fichier .env.docker).
      DATABASE_URL: postgres://${POSTGRES_USER:-asadiya}:${POSTGRES_PASSWORD:-asadiya_dev_password}@db:5432/${POSTGRES_DB:-asadiya_flotte}
      # TLS interne désactivé : le transport est chiffré par le reverse proxy (nginx).
      DB_SSL: "false"
      # 1 seul saut de proxy : l'IP réelle du client est lue derrière nginx.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Paiements (Phase 5.1 → 5.4) : simulation locale par défaut, aucun
      # fournisseur réel activé (aucun appel réseau, aucune clé API requise).
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYMENT_TIMEOUT: ${PAYMENT_TIMEOUT:-120000}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      WAVE_ENABLED: ${WAVE_ENABLED:-false}
      ORANGE_ENABLED: ${ORANGE_ENABLED:-false}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      # Wave Money (Phase 5.2) — injectés seulement s'ils sont définis.
      WAVE_API_URL: ${WAVE_API_URL:-https://api.wave.com}
      WAVE_API_KEY: ${WAVE_API_KEY:-}
      WAVE_API_SECRET: ${WAVE_API_SECRET:-}
      WAVE_WEBHOOK_SECRET: ${WAVE_WEBHOOK_SECRET:-}
      WAVE_TIMEOUT: ${WAVE_TIMEOUT:-30000}
      WAVE_SUCCESS_URL: ${WAVE_SUCCESS_URL:-}
      WAVE_ERROR_URL: ${WAVE_ERROR_URL:-}
      # Orange Money (Phase 5.3) — injectés seulement s'ils sont définis.
      ORANGE_API_URL: ${ORANGE_API_URL:-https://api.orange.com}
      ORANGE_CLIENT_ID: ${ORANGE_CLIENT_ID:-}
      ORANGE_CLIENT_SECRET: ${ORANGE_CLIENT_SECRET:-}
      ORANGE_MERCHANT_ID: ${ORANGE_MERCHANT_ID:-}
      ORANGE_WEBHOOK_SECRET: ${ORANGE_WEBHOOK_SECRET:-}
      ORANGE_TOKEN_PATH: ${ORANGE_TOKEN_PATH:-/oauth/v3/token}
      ORANGE_WEBPAYMENT_PATH: ${ORANGE_WEBPAYMENT_PATH:-/orange-money-webpay/dev/v1/webpayment}
      ORANGE_TRANSACTION_STATUS_PATH: ${ORANGE_TRANSACTION_STATUS_PATH:-/orange-money-webpay/dev/v1/transactionstatus}
      ORANGE_NOTIF_URL: ${ORANGE_NOTIF_URL:-}
      ORANGE_SUCCESS_URL: ${ORANGE_SUCCESS_URL:-}
      ORANGE_ERROR_URL: ${ORANGE_ERROR_URL:-}
      ORANGE_TIMEOUT: ${ORANGE_TIMEOUT:-30000}
      # Stripe (Phase 5.4) — injectés seulement s'ils sont définis.
      STRIPE_API_URL: ${STRIPE_API_URL:-https://api.stripe.com}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_API_VERSION: ${STRIPE_API_VERSION:-2024-06-20}
      STRIPE_TIMEOUT: ${STRIPE_TIMEOUT:-30000}
    ports:
      # Exposé vers l'hôte (nginx sur le même hôte, ou accès direct).
      - "${APP_PORT:-4000}:${PORT:-4000}"
    volumes:
      # Pièces jointes documents : volume persistant, partagé avec la
      # sauvegarde VPS. Les fichiers survivent à `docker compose down` et
      # aux rebuilds de l'image.
      - uploads:/app/uploads
    networks:
      - asadiya_net

networks:
  # Réseau interne dédié, isolé des autres stacks.
  asadiya_net:
    driver: bridge

volumes:
  # Volume persistant PostgreSQL : les données sont conservées
  # entre les redémarrages (docker compose down) et les reconstructions.
  pgdata:
  # Volume persistant des pièces jointes documents (Phase Documentation —
  # Commit 5). JAMAIS exposé en statique : la lecture passe par l'API
  # authentifiée (/api/documents/:id/file).
  uploads:
