                <div>
                    <label class="block text-slate-400 mb-1">Adresse Email</label>
                    <input type="email" x-model="newDriver.email" placeholder="ex: o.sow@asadiyaflotte.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Téléphone</label>
                    <input type="text" x-model="newDriver.phone" placeholder="ex: +221 77 000 00 00" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Numéro de Permis de Conduire</label>
                    <input type="text" x-model="newDriver.license" placeholder="ex: B-993021" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Date d'Expiration du Permis</label>
                    <input type="date" x-model="newDriver.licenseExpiry" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <div class="flex justify-end space-x-2 pt-2">
                <button @click="showDriverModal = false" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs hover:bg-slate-700">Annuler</button>
                <button @click="addDriverSubmit()" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs hover:bg-indigo-500 font-bold" x-text="editingDriverId ? 'Enregistrer les Modifications' : 'Ajouter le Conducteur'"></button>
            </div>
        </div>
    </div>

    <!-- MODALE : PLANIFIER UN ENTRETIEN -->
    <div x-show="showMaintenanceModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" x-cloak>
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-md space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-white" x-text="editingMaintenanceId ? 'Modifier l\'Entretien' : 'Planifier un Entretien'"></h3>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">Véhicule</label>
                    <select x-model="newMaintenance.vehicleId" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="">Sélectionner un véhicule...</option>
                        <template x-for="v in vehicles" :key="v.id">
                            <option :value="v.id" x-text="v.brand + ' ' + v.model + ' (' + v.plate + ')'"></option>
                        </template>
                    </select>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Type d'Intervention</label>
                    <input type="text" x-model="newMaintenance.type" placeholder="ex: Vidange complète, Remplacement des freins" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1">Date Prévue</label>
                        <input type="date" x-model="newMaintenance.date" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">Coût Estimé (FCFA)</label>
                        <input type="number" x-model="newMaintenance.cost" placeholder="0" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Garage / Prestataire</label>
                    <input type="text" x-model="newMaintenance.provider" placeholder="ex: Garage Central Dakar" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Priorité / Statut</label>
                    <select x-model="newMaintenance.status" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="PLANIFIÉ">PLANIFIÉ</option>
                        <option value="URGENT">URGENT (Immobilise le véhicule)</option>
                    </select>
                </div>
            </div>

            <div class="flex justify-end space-x-2 pt-2">
                <button @click="showMaintenanceModal = false" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs hover:bg-slate-700">Annuler</button>
                <button @click="addMaintenanceSubmit()" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs hover:bg-indigo-500 font-bold">Planifier</button>
            </div>
        </div>
    </div>

    <!-- MODALE : SIGNALEMENT / DYSFONCTIONNEMENT -->
    <div x-show="showIncidentModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" x-cloak>
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-md space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-white" x-text="editingIncidentId ? 'Modifier le Signalement' : 'Déclarer un Signalement'"></h3>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">Véhicule Concerné</label>
                    <select x-model="newIncident.vehicleId" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="">Sélectionner un véhicule...</option>
                        <template x-for="v in vehicles" :key="v.id">
                            <option :value="v.id" x-text="v.brand + ' ' + v.model + ' (' + v.plate + ')'"></option>
                        </template>
                    </select>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Conducteur Rapporteur</label>
                    <select x-model="newIncident.driverId" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="">Sélectionner un conducteur...</option>
                        <template x-for="d in drivers" :key="d.id">
                            <option :value="d.id" x-text="d.name"></option>
                        </template>
                    </select>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Objet du Signalement</label>
                    <input type="text" x-model="newIncident.title" placeholder="ex: Voyant d'huile, bruit de courroie..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Priorité d'Urgence</label>
                    <select x-model="newIncident.priority" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="BASSE">BASSE (À vérifier lors du prochain entretien)</option>
                        <option value="MOYENNE">MOYENNE (Nécessite contrôle sous peu)</option>
                        <option value="HAUTE">HAUTE (Nécessite intervention rapide)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Description détaillée</label>
                    <textarea x-model="newIncident.description" rows="3" placeholder="Symptômes observés, circonstances..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500"></textarea>
                </div>
            </div>

            <div class="flex justify-end space-x-2 pt-2">
                <button @click="showIncidentModal = false" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs hover:bg-slate-700">Annuler</button>
                <button @click="addIncidentSubmit()" class="px-4 py-2 rounded-xl bg-amber-600 text-white text-xs hover:bg-amber-500 font-bold">Enregistrer le Signalement</button>
            </div>
        </div>
    </div>

    <!-- MODALE : DÉCLARATION D'ACCIDENT -->
    <div x-show="showAccidentModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" x-cloak>
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-md space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-car-burst text-rose-500"></i>
                <span x-text="editingAccidentId ? 'Modifier le Dossier Accident' : 'Déclarer un Accident'"></span>
            </h3>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">Véhicule Impliqué</label>
                    <select x-model="newAccident.vehicleId" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="">Sélectionner un véhicule...</option>
                        <template x-for="v in vehicles" :key="v.id">
                            <option :value="v.id" x-text="v.brand + ' ' + v.model + ' (' + v.plate + ')'"></option>
                        </template>
                    </select>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Conducteur au moment des faits</label>
                    <select x-model="newAccident.driverId" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="">Sélectionner un conducteur...</option>
                        <template x-for="d in drivers" :key="d.id">
                            <option :value="d.id" x-text="d.name"></option>
                        </template>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1">Date du Sinistre</label>
                        <input type="date" x-model="newAccident.date" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">Lieu précis</label>
                        <input type="text" x-model="newAccident.location" placeholder="ex: Intersection VDN" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Dégâts apparents</label>
                    <textarea x-model="newAccident.damage" rows="2" placeholder="Description des dommages matériels..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1">Tiers Impliqué ?</label>
                        <select x-model="newAccident.thirdParty" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                            <option value="Oui">Oui</option>
                            <option value="Non">Non (Seul en cause)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">Constat Amiable ?</label>
                        <select x-model="newAccident.report" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                            <option value="Oui (Signé)">Oui (Signé)</option>
                            <option value="En attente PV Police">En attente PV Police</option>
                            <option value="Non">Non</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Estimation des Réparations (FCFA)</label>
                    <input type="number" x-model="newAccident.costEstimate" placeholder="0" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <div class="flex justify-end space-x-2 pt-2">
                <button @click="showAccidentModal = false" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs hover:bg-slate-700">Annuler</button>
                <button @click="addAccidentSubmit()" class="px-4 py-2 rounded-xl bg-rose-600 text-white text-xs hover:bg-rose-500 font-bold" x-text="editingAccidentId ? 'Enregistrer les Modifications' : 'Enregistrer & Immobiliser Véhicule'"></button>
            </div>
        </div>
    </div>

    <!-- MODALE : DEMANDE DE RÉSERVATION -->
    <div x-show="showReservationModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" x-cloak>
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-md space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-white" x-text="editingReservationId ? 'Modifier la Réservation' : 'Nouvelle Demande de Réservation'"></h3>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">Véhicule</label>
                    <select x-model="newReservation.vehicleId" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="">Sélectionner un véhicule...</option>
                        <template x-for="v in vehicles" :key="v.id">
                            <option :value="v.id" x-text="v.brand + ' ' + v.model + ' (' + v.plate + ')'"></option>
                        </template>
                    </select>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Conducteur</label>
                    <select x-model="newReservation.driverId" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="">Sélectionner un conducteur...</option>
                        <template x-for="d in drivers" :key="d.id">
                            <option :value="d.id" x-text="d.name"></option>
                        </template>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1">Date Début</label>
                        <input type="datetime-local" x-model="newReservation.start" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">Date Fin</label>
                        <input type="datetime-local" x-model="newReservation.end" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div x-show="liveReservationConflict" class="p-3 bg-rose-950/40 rounded-xl border border-rose-500/30 text-rose-300 text-[11px] flex items-start gap-2">
                    <i class="fa-solid fa-triangle-exclamation mt-0.5"></i>
                    <span>
                        Conflit de planning : ce véhicule est déjà réservé par
                        <strong x-text="liveReservationConflict ? liveReservationConflict.driver : ''"></strong>
                        du <span x-text="liveReservationConflict ? liveReservationConflict.start : ''"></span>
                        au <span x-text="liveReservationConflict ? liveReservationConflict.end : ''"></span>.
                    </span>
                </div>

                <div>
                    <label class="block text-slate-400 mb-1">Motif de la Mission</label>
                    <input type="text" x-model="newReservation.purpose" placeholder="ex: Visite de site client" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <div class="flex justify-end space-x-2 pt-2">
                <button @click="showReservationModal = false" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs hover:bg-slate-700">Annuler</button>
                <button @click="addReservationSubmit()" :disabled="!!liveReservationConflict" :class="liveReservationConflict ? 'opacity-40 cursor-not-allowed' : 'hover:bg-indigo-500'" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold transition" x-text="editingReservationId ? 'Enregistrer les Modifications' : 'Soumettre'"></button>
            </div>
        </div>
    </div>

    <!-- MODALE : AJOUT / MODIFICATION UTILISATEUR -->
    <div x-show="showUserModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" x-cloak>
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-md space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-white" x-text="editingUserId ? 'Modifier l\'Utilisateur' : 'Ajouter un Utilisateur'"></h3>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">Nom complet</label>
                    <input type="text" x-model="newUser.name" placeholder="ex: Ousmane Sow" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1">Identifiant</label>
                        <input type="text" x-model="newUser.username" placeholder="ex: o.sow" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1" x-text="editingUserId ? 'Nouveau mot de passe (optionnel)' : 'Mot de passe'"></label>
                        <input type="text" x-model="newUser.password" placeholder="min. 6 caractères" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Rôle</label>
                    <select x-model="newUser.role" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="ADMIN">Administrateur</option>
                        <option value="MANAGER">Gestionnaire de Flotte</option>
                        <option value="DRIVER">Conducteur</option>
                    </select>
                </div>
                <p x-show="userError" x-text="userError" class="text-rose-400 text-[11px] font-semibold"></p>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button @click="showUserModal = false" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs hover:bg-slate-700">Annuler</button>
                <button @click="saveUserSubmit()" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs hover:bg-indigo-500 font-bold" x-text="editingUserId ? 'Enregistrer' : 'Créer le Compte'"></button>
            </div>
        </div>
    </div>

    </div>
    </template>

</body>
</html>
