<!DOCTYPE html>
<html lang="fr" x-data="asadiyaFlotteApp()" x-init="initApp()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asadiya Flotte PRO - Gestion de Flotte & Alertes Vidanges</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- jsPDF + AutoTable CDN (export PDF) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <!-- SheetJS CDN (export Excel) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script src="app.js"></script>

    <!-- Alpine.js CDN avec l'attribut defer -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        [x-cloak] { display: none !important; }

        @keyframes float-slow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float { animation: float-slow 4s ease-in-out infinite; }
        
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-fast { animation: pulse-fast 1.5s infinite; }

        @keyframes marquee {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee { display: flex; width: 200%; animation: marquee 25s linear infinite; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

    <!-- ========================================== -->
    <!-- ESPACE PUBLIC (landing / tarifs / connexion /
    <!--                    inscription)            -->
    <!-- ========================================== -->
    <template x-if="!currentUser">
    <div class="min-h-screen flex flex-col bg-slate-950">

        <!-- NAVIGATION PUBLIQUE -->
        <header class="sticky top-0 z-50 border-b border-slate-800 bg-slate-950/85 backdrop-blur-md">
            <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center space-x-2.5">
                    <div class="bg-indigo-600 w-10 h-10 rounded-xl text-white shadow-lg shadow-indigo-500/30 flex items-center justify-center">
                        <i class="fa-solid fa-truck-fast text-lg"></i>
                    </div>
                    <div>
                        <h1 class="font-extrabold text-base text-white">Asadiya Flotte <span class="text-indigo-400">PRO</span></h1>
                        <p class="text-[10px] text-slate-400 font-medium">Gestion intelligente de flotte automobile</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button @click="showLogin()" class="text-xs font-semibold text-slate-300 hover:text-white px-4 py-2 rounded-xl hover:bg-slate-800 transition">
                        <i class="fa-solid fa-right-to-bracket mr-1"></i>Se connecter
                    </button>
                    <button @click="startSignup()" class="text-xs font-bold bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl transition">
                        Créer un compte
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-grow w-full">

            <!-- ===== PAGE D'ACCUEIL / TARIFS ===== -->
            <div x-show="publicView === 'landing'" class="max-w-7xl mx-auto px-4 md:px-6 space-y-16 py-12">

                <!-- HERO -->
                <section class="text-center space-y-6 pt-4 md:pt-10">
                    <span class="inline-flex items-center gap-1.5 bg-indigo-500/10 border border-indigo-500/30 text-indigo-300 text-[11px] font-bold px-3 py-1.5 rounded-full">
                        <i class="fa-solid fa-sparkles"></i> Nouvelle version SaaS multi-entreprises
                    </span>
                    <h1 class="text-3xl md:text-5xl font-extrabold text-white leading-tight max-w-3xl mx-auto">
                        Pilotez toute votre flotte, <span class="text-indigo-400">sans effort.</span>
                    </h1>
                    <p class="text-sm md:text-base text-slate-400 max-w-2xl mx-auto">
                        Tableau de bord, alertes vidanges, planning, carburant, signalements et accidents…
                        Asadiya Flotte PRO centralise la gestion de votre parc dans une interface moderne et claire.
                    </p>
                    <div class="flex flex-wrap items-center justify-center gap-3 pt-2">
                        <button @click="startSignup()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm px-6 py-3 rounded-xl shadow-lg shadow-indigo-500/25 transition">
                            <i class="fa-solid fa-user-plus mr-2"></i>Créer un compte gratuit
                        </button>
                        <a href="#tarifs" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-sm px-6 py-3 rounded-xl transition">
                            Voir les tarifs
                        </a>
                    </div>
                    <p class="text-[11px] text-slate-500">Essai gratuit de 14 jours — sans carte bancaire.</p>
                </section>

                <!-- FONCTIONNALITÉS -->
                <section class="space-y-6">
                    <div class="text-center space-y-2">
                        <h2 class="text-2xl font-extrabold text-white">Tout le nécessaire pour votre parc</h2>
                        <p class="text-xs text-slate-500">Des fonctionnalités pensées pour les flottes de 5 à 500+ véhicules.</p>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-2.5">
                            <div class="w-10 h-10 rounded-xl bg-indigo-500/15 text-indigo-400 flex items-center justify-center"><i class="fa-solid fa-chart-pie"></i></div>
                            <h3 class="text-sm font-bold text-white">Tableau de bord &amp; KPIs</h3>
                            <p class="text-xs text-slate-400 leading-relaxed">Disponibilité, coûts, Fleet Health Score et graphiques en temps réel.</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-2.5">
                            <div class="w-10 h-10 rounded-xl bg-amber-500/15 text-amber-400 flex items-center justify-center"><i class="fa-solid fa-oil-can"></i></div>
                            <h3 class="text-sm font-bold text-white">Alertes vidanges &amp; entretien</h3>
                            <p class="text-xs text-slate-400 leading-relaxed">Suivi préventif des vidanges et des échéances par véhicule.</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-2.5">
                            <div class="w-10 h-10 rounded-xl bg-emerald-500/15 text-emerald-400 flex items-center justify-center"><i class="fa-solid fa-calendar-days"></i></div>
                            <h3 class="text-sm font-bold text-white">Planning &amp; réservations</h3>
                            <p class="text-xs text-slate-400 leading-relaxed">Missions planifiées avec détection automatique des conflits.</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-2.5">
                            <div class="w-10 h-10 rounded-xl bg-violet-500/15 text-violet-400 flex items-center justify-center"><i class="fa-solid fa-gas-pump"></i></div>
                            <h3 class="text-sm font-bold text-white">Carburant</h3>
                            <p class="text-xs text-slate-400 leading-relaxed">Pleins, coûts et consommation moyenne (L/100 km) par véhicule.</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-2.5">
                            <div class="w-10 h-10 rounded-xl bg-rose-500/15 text-rose-400 flex items-center justify-center"><i class="fa-solid fa-triangle-exclamation"></i></div>
                            <h3 class="text-sm font-bold text-white">Signalements &amp; accidents</h3>
                            <p class="text-xs text-slate-400 leading-relaxed">Pannes, incidents et dossiers d'assurance suivis de bout en bout.</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-2.5">
                            <div class="w-10 h-10 rounded-xl bg-sky-500/15 text-sky-400 flex items-center justify-center"><i class="fa-solid fa-file-shield"></i></div>
                            <h3 class="text-sm font-bold text-white">Documents &amp; permis</h3>
                            <p class="text-xs text-slate-400 leading-relaxed">Alertes sur les assurances, cartes grises, contrôles techniques et permis.</p>
                        </div>
                    </div>
                </section>

                <!-- TARIFS -->
                <section id="tarifs" class="scroll-mt-24 space-y-6">
                    <div class="text-center space-y-2">
                        <h2 class="text-2xl font-extrabold text-white">Offres simples et évolutives</h2>
                        <p class="text-xs text-slate-500">Commencez en Starter et changez de plan quand votre flotte grandit.</p>
                    </div>

                    <div x-show="publicPlansLoading" class="text-center text-slate-400 text-sm py-10">
                        <i class="fa-solid fa-spinner fa-spin text-xl"></i>
                        <p class="mt-2">Chargement des offres...</p>
                    </div>
                    <p x-show="publicPlansError" class="text-center text-rose-400 text-xs" x-text="publicPlansError"></p>

                    <div x-show="!publicPlansLoading && publicPlans.length > 0" class="grid grid-cols-1 md:grid-cols-3 gap-6 items-stretch">
                        <template x-for="plan in publicPlans" :key="plan.id">
                            <div class="relative bg-slate-900 border border-slate-800 rounded-3xl p-6 flex flex-col transition hover:border-indigo-500/50"
                                 :class="plan.code === 'PRO' ? 'border-indigo-500/50 ring-1 ring-indigo-500/30 md:-mt-2 md:mb-2' : ''">
                                <span x-show="plan.code === 'PRO'" class="absolute -top-3 left-1/2 -translate-x-1/2 bg-indigo-600 text-white text-[10px] font-bold px-3 py-1 rounded-full whitespace-nowrap">
                                    <i class="fa-solid fa-crown mr-1"></i>POPULAIRE
                                </span>
                                <h3 class="text-sm font-bold text-white uppercase tracking-wider" x-text="plan.name"></h3>
                                <p class="mt-1 text-[11px] text-slate-400 leading-relaxed" x-text="plan.description"></p>
                                <div class="mt-4 flex items-baseline gap-1">
                                    <span class="text-3xl font-extrabold text-white font-mono" x-text="fmtPrice(plan.monthlyPrice)"></span>
                                    <span class="text-xs text-slate-500">FCFA / mois</span>
                                </div>
                                <p class="mt-1 text-[11px] text-slate-500">
                                    <span x-show="plan.maxVehicles" x-text="'Jusqu\'à ' + fmtNum(plan.maxVehicles) + ' véhicules'"></span>
                                    <span x-show="!plan.maxVehicles">Véhicules illimités</span>
                                    <span> · </span>
                                    <span x-show="plan.maxUsers" x-text="fmtNum(plan.maxUsers) + ' utilisateurs'"></span>
                                    <span x-show="!plan.maxUsers">Utilisateurs illimités</span>
                                </p>
                                <ul class="mt-4 space-y-2 text-xs flex-grow">
                                    <template x-for="f in plan.features" :key="f">
                                        <li class="flex items-start gap-2 text-slate-300">
                                            <i class="fa-solid fa-circle-check text-emerald-400 mt-0.5 text-[10px]"></i>
                                            <span x-text="f"></span>
                                        </li>
                                    </template>
                                </ul>
                                <button @click="startSignup(plan.code)" class="mt-6 w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-2.5 rounded-xl transition">
                                    Créer un compte
                                </button>
                            </div>
                        </template>
                    </div>
                </section>

                <!-- COMPARAISON -->
                <section class="space-y-6">
                    <div class="text-center space-y-2">
                        <h2 class="text-2xl font-extrabold text-white">Comparer les offres</h2>
                        <p class="text-xs text-slate-500">Le détail des limites et fonctionnalités de chaque plan.</p>
                    </div>
                    <div x-show="publicPlans.length > 0" class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden overflow-x-auto">
                        <table class="w-full text-left text-xs min-w-[640px]">
                            <thead>
                                <tr class="text-slate-500 border-b border-slate-800 bg-slate-950/40">
                                    <th class="px-5 py-3 font-semibold">Fonctionnalité</th>
                                    <template x-for="plan in publicPlans" :key="'cmp-h-' + plan.id">
                                        <th class="px-4 py-3 font-bold text-slate-200 text-center" :class="plan.code === 'PRO' ? 'text-indigo-300' : ''" x-text="plan.name"></th>
                                    </template>
                                </tr>
                            </thead>
                            <tbody>
                                <tr class="border-b border-slate-800/60">
                                    <td class="px-5 py-3 text-slate-300">Prix mensuel</td>
                                    <template x-for="plan in publicPlans" :key="'cmp-p-' + plan.id">
                                        <td class="px-4 py-3 text-center font-mono font-bold text-white" x-text="fmtPrice(plan.monthlyPrice) + ' F'"></td>
                                    </template>
                                </tr>
                                <tr class="border-b border-slate-800/60">
                                    <td class="px-5 py-3 text-slate-300">Véhicules maximum</td>
                                    <template x-for="plan in publicPlans" :key="'cmp-v-' + plan.id">
                                        <td class="px-4 py-3 text-center text-slate-200" x-text="plan.maxVehicles ? fmtNum(plan.maxVehicles) : 'Illimité'"></td>
                                    </template>
                                </tr>
                                <tr class="border-b border-slate-800/60">
                                    <td class="px-5 py-3 text-slate-300">Utilisateurs maximum</td>
                                    <template x-for="plan in publicPlans" :key="'cmp-u-' + plan.id">
                                        <td class="px-4 py-3 text-center text-slate-200" x-text="plan.maxUsers ? fmtNum(plan.maxUsers) : 'Illimité'"></td>
                                    </template>
                                </tr>
                                <template x-for="feat in comparisonFeatures" :key="'cmp-r-' + feat">
                                    <tr class="border-b border-slate-800/60">
                                        <td class="px-5 py-3 text-slate-300" x-text="feat"></td>
                                        <template x-for="plan in publicPlans" :key="'cmp-c-' + plan.id + '-' + feat">
                                            <td class="px-4 py-3 text-center">
                                                <template x-if="(plan.features || []).includes(feat)">
                                                    <i class="fa-solid fa-circle-check text-emerald-400"></i>
                                                </template>
                                                <template x-if="!(plan.features || []).includes(feat)">
                                                    <span class="text-slate-600">—</span>
                                                </template>
                                            </td>
                                        </template>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- APPEL À L'ACTION FINAL -->
                <section class="bg-gradient-to-r from-indigo-900/50 via-slate-900 to-indigo-950 border border-indigo-500/20 rounded-3xl p-8 md:p-12 text-center space-y-4">
                    <h2 class="text-2xl md:text-3xl font-extrabold text-white">Prêt à moderniser la gestion de votre flotte ?</h2>
                    <p class="text-sm text-slate-400 max-w-xl mx-auto">
                        Créez votre compte en 2 minutes : votre entreprise, votre administrateur, et c'est parti.
                        Période d'essai de 14 jours offerte.
                    </p>
                    <button @click="startSignup()" class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm px-8 py-3.5 rounded-xl shadow-lg shadow-indigo-500/25 transition">
                        <i class="fa-solid fa-user-plus"></i>Créer un compte gratuit
                    </button>
                </section>
            </div>

            <!-- ===== ÉCRAN DE CONNEXION ===== -->
            <div x-show="publicView === 'login'" class="min-h-[calc(100vh-64px)] flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950" x-cloak>
                <div class="w-full max-w-sm space-y-6">
                    <div class="text-center space-y-2">
                        <button @click="showLanding()" class="inline-flex items-center gap-1 text-[11px] text-slate-500 hover:text-slate-300 transition">
                            <i class="fa-solid fa-arrow-left"></i> Retour à l'accueil
                        </button>
                        <div class="bg-indigo-600 w-14 h-14 rounded-2xl text-white shadow-lg shadow-indigo-500/30 flex items-center justify-center mx-auto mt-2">
                            <i class="fa-solid fa-truck-fast text-2xl"></i>
                        </div>
                        <h1 class="font-extrabold text-xl text-white">Asadiya Flotte <span class="text-indigo-400">PRO</span></h1>
                        <p class="text-xs text-slate-400">Connectez-vous pour accéder à votre espace</p>
                    </div>

                    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-2xl">
                        <div class="space-y-3 text-xs">
                            <div>
                                <label class="block text-slate-400 mb-1">Identifiant</label>
                                <input type="text" x-model="loginForm.username" @keydown.enter="login()" placeholder="admin / gestionnaire / conducteur" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-slate-400 mb-1">Mot de passe</label>
                                <input type="password" x-model="loginForm.password" @keydown.enter="login()" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                            </div>
                            <p x-show="loginError" x-text="loginError" class="text-rose-400 text-[11px] font-semibold"></p>
                            <button @click="login()" :disabled="isLoggingIn" :class="isLoggingIn ? 'opacity-60 cursor-not-allowed' : 'hover:bg-indigo-500'" class="w-full bg-indigo-600 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                                <i x-show="isLoggingIn" class="fa-solid fa-spinner fa-spin"></i>
                                <span x-text="isLoggingIn ? 'Connexion en cours...' : 'Se connecter'"></span>
                            </button>
                        </div>

                        <div class="border-t border-slate-800 pt-4 space-y-2">
                            <p class="text-[10px] text-slate-500 font-semibold uppercase text-center">Comptes de démonstration</p>
                            <button @click="quickLogin('admin')" class="w-full flex justify-between items-center bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-xl p-2.5 text-[11px] transition">
                                <span class="flex items-center gap-2 text-slate-200"><i class="fa-solid fa-user-shield text-indigo-400"></i> Administrateur</span>
                                <span class="text-slate-500 font-mono">admin / admin123</span>
                            </button>
                            <button @click="quickLogin('gestionnaire')" class="w-full flex justify-between items-center bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-xl p-2.5 text-[11px] transition">
                                <span class="flex items-center gap-2 text-slate-200"><i class="fa-solid fa-user-tie text-amber-400"></i> Gestionnaire</span>
                                <span class="text-slate-500 font-mono">gestionnaire / gest123</span>
                            </button>
                            <button @click="quickLogin('conducteur')" class="w-full flex justify-between items-center bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-xl p-2.5 text-[11px] transition">
                                <span class="flex items-center gap-2 text-slate-200"><i class="fa-solid fa-user text-emerald-400"></i> Conducteur</span>
                                <span class="text-slate-500 font-mono">conducteur / cond123</span>
                            </button>
                        </div>

                        <div class="border-t border-slate-800 pt-3 text-center">
                            <p class="text-[11px] text-slate-500">Pas encore de compte ?
                                <button @click="startSignup()" class="text-indigo-400 hover:text-indigo-300 font-bold">Créer un compte</button>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ===== TUNNEL D'INSCRIPTION ===== -->
            <div x-show="publicView === 'signup'" class="min-h-[calc(100vh-64px)] flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950" x-cloak>
                <div class="w-full max-w-md space-y-6">
                    <div class="text-center space-y-2">
                        <button @click="showLanding()" class="inline-flex items-center gap-1 text-[11px] text-slate-500 hover:text-slate-300 transition">
                            <i class="fa-solid fa-arrow-left"></i> Retour à l'accueil
                        </button>
                        <div class="bg-indigo-600 w-14 h-14 rounded-2xl text-white shadow-lg shadow-indigo-500/30 flex items-center justify-center mx-auto mt-2">
                            <i class="fa-solid fa-user-plus text-2xl"></i>
                        </div>
                        <h1 class="font-extrabold text-xl text-white">Créer votre compte</h1>
                        <p class="text-xs text-slate-400">Essai gratuit de 14 jours — sans carte bancaire.</p>
                    </div>

                    <!-- Confirmation de création -->
                    <div x-show="signupDone" class="bg-emerald-950/40 border border-emerald-500/30 rounded-3xl p-6 space-y-3 shadow-2xl text-center">
                        <i class="fa-solid fa-circle-check text-emerald-400 text-3xl"></i>
                        <h2 class="font-extrabold text-white">Compte créé avec succès !</h2>
                        <p class="text-xs text-slate-400">
                            L'entreprise <span class="text-white font-bold" x-text="signupDone.organizationName"></span>
                            est inscrite au plan <span class="text-white font-bold" x-text="signupDone.planName"></span>
                            en période d'essai jusqu'au <span class="text-white font-bold" x-text="signupDone.trialEndsAt"></span>.
                        </p>
                        <button @click="login()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-2.5 rounded-xl transition">
                            Accéder à mon espace
                        </button>
                    </div>

                    <!-- Formulaire d'inscription -->
                    <div x-show="!signupDone" class="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-2xl">
                        <div class="space-y-3 text-xs">
                            <div>
                                <label class="block text-slate-400 mb-1">Entreprise / Organisation <span class="text-rose-400">*</span></label>
                                <input type="text" x-model="signupForm.name" placeholder="ex: Transport Ndiaye SARL" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                            </div>

                            <div>
                                <label class="block text-slate-400 mb-1">Votre plan</label>
                                <select x-model="signupForm.planCode" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                                    <template x-for="plan in publicPlans" :key="'signup-plan-' + plan.id">
                                        <option :value="plan.code" x-text="plan.name + ' — ' + fmtPrice(plan.monthlyPrice) + ' FCFA/mois'"></option>
                                    </template>
                                </select>
                            </div>

                            <div class="pt-2 border-t border-slate-800">

                        <option value="">Sélectionner un conducteur...</option>
                        <template x-for="d in drivers" :key="d.id">
                            <option :value="d.id" x-text="d.name"></option>
                        </template>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1">Date du Sinistre</label>
                        <input type="date" x-model="newAccident.date" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">Lieu précis</label>
                        <input type="text" x-model="newAccident.location" placeholder="ex: Intersection VDN" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Dégâts apparents</label>
                    <textarea x-model="newAccident.damage" rows="2" placeholder="Description des dommages matériels..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1">Tiers Impliqué ?</label>
                        <select x-model="newAccident.thirdParty" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                            <option value="Oui">Oui</option>
                            <option value="Non">Non (Seul en cause)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">Constat Amiable ?</label>
                        <select x-model="newAccident.report" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                            <option value="Oui (Signé)">Oui (Signé)</option>
                            <option value="En attente PV Police">En attente PV Police</option>
                            <option value="Non">Non</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Estimation des Réparations (FCFA)</label>
                    <input type="number" x-model="newAccident.costEstimate" placeholder="0" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <div class="flex justify-end space-x-2 pt-2">
                <button @click="showAccidentModal = false" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs hover:bg-slate-700">Annuler</button>
                <button @click="addAccidentSubmit()" class="px-4 py-2 rounded-xl bg-rose-600 text-white text-xs hover:bg-rose-500 font-bold" x-text="editingAccidentId ? 'Enregistrer les Modifications' : 'Enregistrer & Immobiliser Véhicule'"></button>
            </div>
        </div>
    </div>

    <!-- MODALE : DEMANDE DE RÉSERVATION -->
    <div x-show="showReservationModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" x-cloak>
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-md space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-white" x-text="editingReservationId ? 'Modifier la Réservation' : 'Nouvelle Demande de Réservation'"></h3>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">Véhicule</label>
                    <select x-model="newReservation.vehicleId" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="">Sélectionner un véhicule...</option>
                        <template x-for="v in vehicles" :key="v.id">
                            <option :value="v.id" x-text="v.brand + ' ' + v.model + ' (' + v.plate + ')'"></option>
                        </template>
                    </select>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Conducteur</label>
                    <select x-model="newReservation.driverId" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="">Sélectionner un conducteur...</option>
                        <template x-for="d in drivers" :key="d.id">
                            <option :value="d.id" x-text="d.name"></option>
                        </template>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1">Date Début</label>
                        <input type="datetime-local" x-model="newReservation.start" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">Date Fin</label>
                        <input type="datetime-local" x-model="newReservation.end" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div x-show="liveReservationConflict" class="p-3 bg-rose-950/40 rounded-xl border border-rose-500/30 text-rose-300 text-[11px] flex items-start gap-2">
                    <i class="fa-solid fa-triangle-exclamation mt-0.5"></i>
                    <span>
                        Conflit de planning : ce véhicule est déjà réservé par
                        <strong x-text="liveReservationConflict ? liveReservationConflict.driver : ''"></strong>
                        du <span x-text="liveReservationConflict ? liveReservationConflict.start : ''"></span>
                        au <span x-text="liveReservationConflict ? liveReservationConflict.end : ''"></span>.
                    </span>
                </div>

                <div>
                    <label class="block text-slate-400 mb-1">Motif de la Mission</label>
                    <input type="text" x-model="newReservation.purpose" placeholder="ex: Visite de site client" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <div class="flex justify-end space-x-2 pt-2">
                <button @click="showReservationModal = false" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs hover:bg-slate-700">Annuler</button>
                <button @click="addReservationSubmit()" :disabled="!!liveReservationConflict" :class="liveReservationConflict ? 'opacity-40 cursor-not-allowed' : 'hover:bg-indigo-500'" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold transition" x-text="editingReservationId ? 'Enregistrer les Modifications' : 'Soumettre'"></button>
            </div>
        </div>
    </div>

    <!-- MODALE : AJOUT / MODIFICATION UTILISATEUR -->
    <div x-show="showUserModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" x-cloak>
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-md space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-white" x-text="editingUserId ? 'Modifier l\'Utilisateur' : 'Ajouter un Utilisateur'"></h3>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">Nom complet</label>
                    <input type="text" x-model="newUser.name" placeholder="ex: Ousmane Sow" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1">Identifiant</label>
                        <input type="text" x-model="newUser.username" placeholder="ex: o.sow" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1" x-text="editingUserId ? 'Nouveau mot de passe (optionnel)' : 'Mot de passe'"></label>
                        <input type="text" x-model="newUser.password" placeholder="min. 6 caractères" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Rôle</label>
                    <select x-model="newUser.role" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="ADMIN">Administrateur</option>
                        <option value="MANAGER">Gestionnaire de Flotte</option>
                        <option value="DRIVER">Conducteur</option>
                    </select>
                </div>
                <p x-show="userError" x-text="userError" class="text-rose-400 text-[11px] font-semibold"></p>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button @click="showUserModal = false" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs hover:bg-slate-700">Annuler</button>
                <button @click="saveUserSubmit()" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs hover:bg-indigo-500 font-bold" x-text="editingUserId ? 'Enregistrer' : 'Créer le Compte'"></button>
            </div>
        </div>
    </div>

    </div>
    </template>

</body>
</html>
