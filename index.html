    <!-- Thème clair/sombre/auto : appliqué AVANT le premier rendu (aucun flash / FOUC).
         Priorité au choix mémorisé ('light' | 'dark' | 'auto'), sinon au réglage
         système (prefers-color-scheme) via le mode 'auto'. -->
    <script>
        (function () {
            var KEY = 'asadiya-theme';
            function read(mode) { try { return localStorage.getItem(mode); } catch (e) { return null; } }
            function write(mode, v) { try { localStorage.setItem(mode, v); } catch (e) {} }
            function systemDark() { return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }

            // Mode mémorisé : 'light' | 'dark' | 'auto' (défaut 'auto' => suit le système).
            window.getThemeMode = function () {
                var m = read(KEY);
                return (m === 'light' || m === 'dark' || m === 'auto') ? m : 'auto';
            };

            // Thème effectivement appliqué (résolution du mode 'auto').
            window.getEffectiveTheme = function () {
                var m = window.getThemeMode();
                return m === 'auto' ? (systemDark() ? 'dark' : 'light') : m;
            };

            // Applique le thème et notifie (bascule header, icônes, graphiques, etc.).
            window.__themeListeners = [];
            window.addEventListenerThemeChange = function (fn) {
                if (typeof fn === 'function') window.__themeListeners.push(fn);
            };
            window.applyTheme = function (m) {
                var eff = (m === 'light' || m === 'dark') ? m : window.getEffectiveTheme();
                document.documentElement.setAttribute('data-theme', eff);
                if (window.__onThemeChange) window.__onThemeChange(eff);
                (window.__themeListeners || []).forEach(function (fn) {
                    try { fn(eff); } catch (e) { /* un listener ne doit jamais bloquer l'application du thème */ }
                });
            };

            // Choix explicite depuis les Paramètres : mémorise + applique.
            window.setTheme = function (m) {
                m = (m === 'light' || m === 'dark' || m === 'auto') ? m : 'auto';
                write(KEY, m);
                window.applyTheme(m);
            };

            // Bascule clair <-> sombre depuis les boutons du header.
            window.toggleTheme = function () {
                var eff = window.getEffectiveTheme();
                var next = eff === 'dark' ? 'light' : 'dark';
                write(KEY, next);
                window.applyTheme(next);
                console.log('[THEME] bascule :', eff, '->', next, '(mode mémorisé :', window.getThemeMode() + ')');
            };

            // Mode auto : réagit en direct au changement du réglage système.
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').addEventListener) {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
                    if (window.getThemeMode() === 'auto') window.applyTheme('auto');
                });
            }

            // Application immédiate (avant rendu, pas de flash).
            window.applyTheme(window.getThemeMode());

            // ===== Densité d'affichage : 'comfortable' (défaut) | 'compact' =====
            var DKEY = 'asadiya-density';
            window.getDensity = function () {
                var d = read(DKEY);
                return d === 'compact' ? 'compact' : 'comfortable';
            };
            window.setDensity = function (d) {
                d = d === 'compact' ? 'compact' : 'comfortable';
                write(DKEY, d);
                document.documentElement.setAttribute('data-density', d);
                if (window.__onDensityChange) window.__onDensityChange(d);
            };
            document.documentElement.setAttribute('data-density', window.getDensity());
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        /* ==========================================================
           A S A D I Y A   F L O T T E   P R O  -  DESIGN SYSTEM
           Refonte visuelle premium (thème clair)
           ========================================================== */
        :root {
            --primary: #2563eb;
            --primary-strong: #1d4ed8;
            --primary-soft: #eff6ff;
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-soft: #475569;
            --text-muted: #64748b;
            --success: #16a34a;
            --warning: #f59e0b;
            --danger: #dc2626;
            --ring: rgba(37, 99, 235, 0.22);
        }

        html { scroll-behavior: smooth; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        [x-cloak] { display: none !important; }

        ::selection { background: rgba(37, 99, 235, 0.18); }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; background-clip: content-box; border: 2px solid transparent; }

        /* ---------- Animations discrètes ---------- */
        @keyframes float-slow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float { animation: float-slow 4s ease-in-out infinite; }

        @keyframes pulse-fast {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }
        .animate-pulse-fast { animation: pulse-fast 1.6s ease-in-out infinite; }

        @keyframes marquee {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee { display: flex; width: 200%; animation: marquee 30s linear infinite; }

        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fade-in .2s ease both; }

        @keyframes fade-up {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fade-up .35s cubic-bezier(.16,.84,.44,1) both; }

        @keyframes modal-in {
            from { opacity: 0; transform: scale(.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes drawer-in {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }
        .animate-drawer { animation: drawer-in .25s cubic-bezier(.16,.84,.44,1) both; }

        @keyframes ping-soft {
            0% { transform: scale(1); opacity: .8; }
            75%, 100% { transform: scale(1.9); opacity: 0; }
        }
        .animate-ping-soft { animation: ping-soft 1.8s cubic-bezier(0,0,.2,1) infinite; }

        /* ---------- Cartes ---------- */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 1rem;
            box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.04);
        }
        .card-hover { transition: box-shadow .2s ease, transform .2s ease, border-color .2s ease; }
        .card-hover:hover {
            box-shadow: 0 8px 28px -8px rgba(15,23,42,.12);
            border-color: #cbd5e1;
            transform: translateY(-2px);
        }
        .card-pad { padding: 1.25rem; }

        /* ---------- Boutons ---------- */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
            font-size: .78rem; font-weight: 600; line-height: 1.15rem;
            padding: .58rem 1.05rem; border-radius: .75rem;
            border: 1px solid transparent; cursor: pointer; white-space: nowrap;
            transition: all .18s ease; user-select: none;
        }
        .btn:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 1px 2px rgba(37,99,235,.35); }
        .btn-primary:hover:not(:disabled) { background: var(--primary-strong); transform: translateY(-1px); box-shadow: 0 6px 16px -4px rgba(37,99,235,.45); }
        .btn-secondary { background: #fff; color: #334155; border-color: #cbd5e1; box-shadow: 0 1px 2px rgba(15,23,42,.05); }
        .btn-secondary:hover:not(:disabled) { background: #f8fafc; border-color: #94a3b8; }
        .btn-success { background: #15803d; color: #fff; box-shadow: 0 1px 2px rgba(22,163,74,.4); }
        .btn-success:hover:not(:disabled) { background: #166534; transform: translateY(-1px); box-shadow: 0 6px 16px -4px rgba(22,163,74,.45); }
        .btn-danger { background: var(--danger); color: #fff; box-shadow: 0 1px 2px rgba(220,38,38,.35); }
        .btn-danger:hover:not(:disabled) { background: #b91c1c; transform: translateY(-1px); box-shadow: 0 6px 16px -4px rgba(220,38,38,.45); }
        .btn-warning { background: #b45309; color: #fff; box-shadow: 0 1px 2px rgba(180,83,9,.35); }
        .btn-warning:hover:not(:disabled) { background: #92400e; transform: translateY(-1px); box-shadow: 0 6px 16px -4px rgba(180,83,9,.45); }
        .btn-ghost { background: transparent; color: #475569; border-color: transparent; }
        .btn-ghost:hover:not(:disabled) { background: #f1f5f9; }
        .btn-sm { padding: .42rem .75rem; font-size: .7rem; border-radius: .6rem; }
        .btn-xs { padding: .28rem .6rem; font-size: .66rem; border-radius: .5rem; }

        /* ---------- Formulaires ---------- */
        .label { display: block; font-size: .7rem; font-weight: 600; color: #475569; margin-bottom: .35rem; }
        .input {
            width: 100%; background: #fff; border: 1px solid #cbd5e1; border-radius: .7rem;
            padding: .55rem .8rem; font-size: .78rem; color: #0f172a;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .input::placeholder { color: #94a3b8; }
        .input:hover { border-color: #94a3b8; }
        .input:focus {
            outline: none; border-color: #2563eb;
            box-shadow: 0 0 0 3px var(--ring);
        }
        select.input { cursor: pointer; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%23475569'%3e%3cpath fill-rule='evenodd' d='M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z' clip-rule='evenodd'/%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: right .7rem center; background-size: 1rem;
            padding-right: 2.2rem; appearance: none; -webkit-appearance: none; }
        .input[type="date"]::-webkit-calendar-picker-indicator { opacity: .55; cursor: pointer; }

        /* ---------- Badges ---------- */
        .badge {
            display: inline-flex; align-items: center; gap: .3rem;
            font-size: .65rem; font-weight: 700; padding: .24rem .6rem;
            border-radius: .55rem; border: 1px solid transparent; white-space: nowrap;
        }
        .badge-green { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
        .badge-red { background: #fff1f2; color: #be123c; border-color: #fecdd3; }
        .badge-amber { background: #fffbeb; color: #b45309; border-color: #fde68a; }
        .badge-blue { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
        .badge-indigo { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
        .badge-slate { background: #f8fafc; color: #475569; border-color: #e2e8f0; }

        /* ---------- Tableaux ---------- */
        .table-wrap {
            background: #fff; border: 1px solid var(--border); border-radius: 1rem;
            overflow: hidden; box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.04);
        }
        .app-table { width: 100%; border-collapse: collapse; }
        .app-table thead th {
            text-align: left; font-size: .64rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
            color: #475569; background: #f8fafc; padding: .8rem 1rem;
            border-bottom: 1px solid #e2e8f0; white-space: nowrap;
        }
        .app-table tbody td { padding: .85rem 1rem; font-size: .78rem; color: #334155; border-bottom: 1px solid #f1f5f9; }
        .app-table tbody tr { transition: background .12s ease; }
        .app-table tbody tr:hover { background: #f8fafc; }
        .app-table tbody tr:last-child td { border-bottom: none; }
        .app-table tbody tr:nth-child(even) { background: #fafbfe; }
        .app-table tbody tr:nth-child(even):hover { background: #f8fafc; }

        /* ---------- Modales ---------- */
        .modal-backdrop {
            position: fixed; inset: 0; z-index: 60;
            background: rgba(15,23,42,.45); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center; padding: 1rem;
            animation: fade-in .18s ease both;
        }
        .modal-card {
            background: #fff; border: 1px solid #e2e8f0; border-radius: 1.1rem;
            box-shadow: 0 24px 60px -12px rgba(15,23,42,.3);
            animation: modal-in .24s cubic-bezier(.2,.9,.3,1.2) both;
            max-width: 32rem; width: 100%; max-height: 90vh; overflow-y: auto;
        }

        /* ---------- Sidebar ---------- */
        .sidebar { background: #fff; border-right: 1px solid #e2e8f0; }
        .sidebar-group-label {
            font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
            color: #64748b; padding: 1.1rem 1rem .4rem;
        }
        .sidebar-item {
            position: relative; display: flex; align-items: center; gap: .75rem;
            width: 100%; padding: .62rem .85rem; border-radius: .7rem;
            font-size: .8rem; font-weight: 500; color: #475569;
            transition: background .15s ease, color .15s ease;
        }
        .sidebar-item:hover { background: #f1f5f9; color: #0f172a; }
        .sidebar-item.active { background: #eff6ff; color: #1d4ed8; font-weight: 600; }
        .sidebar-item .nav-ico { width: 1.35rem; text-align: center; font-size: .85rem; opacity: .85; }

        /* ==========================================================
           Accessibilité & contraste (WCAG AA)
           Classes dynamiques (générées par app.js) ou utilitaires
           Tailwind trop claires sur fond blanc : forcées vers des
           teintes lisibles. Le lecteur vidéo (.video-player) est un
           îlot sombre : son texte clair est restauré via les règles
           scopées ci-dessous.
           ========================================================== */

        /* Gris : aucune teinte claire illisible sur fond blanc */
        .text-slate-300 { color: #334155 !important; }
        .text-slate-400 { color: #475569 !important; }
        .text-slate-500 { color: #475569 !important; }
        .bg-slate-800.text-slate-400 { color: #94a3b8 !important; }

        /* Palette primaire indigo -> bleu (#2563EB) */
        .text-indigo-100 { color: #eff6ff !important; }
        .text-indigo-300 { color: #4338ca !important; }
        .text-indigo-500 { color: #2563eb !important; }
        .text-indigo-600 { color: #1d4ed8 !important; }
        .text-indigo-700 { color: #1e40af !important; }
        .bg-indigo-500 { background-color: #2563eb !important; }
        .bg-indigo-600 { background-color: #2563eb !important; }
        .bg-indigo-700 { background-color: #1d4ed8 !important; }
        .border-indigo-500 { border-color: #2563eb !important; }
        .ring-indigo-500 { --tw-ring-color: #2563eb !important; }
        .from-indigo-500, .from-indigo-600, .from-indigo-700 { --tw-gradient-from: #2563eb !important; }
        .via-indigo-500, .via-indigo-600, .via-indigo-700 { --tw-gradient-via: #2563eb !important; }
        .to-indigo-500, .to-indigo-600, .to-indigo-700 { --tw-gradient-to: #2563eb !important; }
        .hover\:bg-indigo-500:hover { background-color: #1d4ed8 !important; }
        .hover\:text-indigo-500:hover { color: #1d4ed8 !important; }
        .hover\:text-indigo-600:hover { color: #1d4ed8 !important; }

        /* Accents : teintes trop claires sur fond blanc */
        .text-blue-400 { color: #2563eb !important; }
        .text-sky-400 { color: #0284c7 !important; }
        .text-violet-400 { color: #7c3aed !important; }
        .text-orange-400 { color: #ea580c !important; }
        .text-emerald-300, .text-emerald-400 { color: #047857 !important; }
        .text-emerald-500, .text-emerald-600 { color: #047857 !important; }
        .text-rose-300, .text-rose-400 { color: #dc2626 !important; }
        .text-rose-500, .text-rose-600 { color: #dc2626 !important; }
        .text-amber-300, .text-amber-400 { color: #b45309 !important; }
        .text-amber-500, .text-amber-600 { color: #b45309 !important; }

        /* Lecteur vidéo : îlot sombre -> texte clair restauré */
        .video-player .text-slate-200 { color: #e2e8f0 !important; }
        .video-player .text-slate-300 { color: #cbd5e1 !important; }
        .video-player .text-slate-400 { color: #94a3b8 !important; }
        .video-player .text-slate-500 { color: #94a3b8 !important; }
        .video-player .text-indigo-400 { color: #818cf8 !important; }
        .video-player .text-emerald-400 { color: #34d399 !important; }
        .video-player .text-rose-400 { color: #fb7185 !important; }
        .video-player .text-amber-400 { color: #fbbf24 !important; }
        .video-player .bg-slate-800 { background-color: #1e293b !important; }
        .video-player .bg-indigo-500 { background-color: #2563eb !important; }
        .video-player .bg-indigo-600 { background-color: #2563eb !important; }
        .video-player .hover\:bg-indigo-500:hover { background-color: #1d4ed8 !important; }

        /* ==========================================================
           THÈME SOMBRE  (html[data-theme="dark"])
           Palette dédiée — pas une simple inversion. Les classes
           Tailwind et les règles "thème clair" ci-dessus sont
           surchargées ici avec une spécificité supérieure.
           ========================================================== */
        html[data-theme="dark"] {
            --primary: #3b82f6;
            --primary-strong: #60a5fa;
            --primary-soft: rgba(59, 130, 246, .14);
            --bg: #0b1120;
            --surface: #111a2b;
            --border: #1e2a44;
            --text: #e6edf7;
            --text-soft: #9aa8c1;
            --text-muted: #64748b;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --ring: rgba(59, 130, 246, .35);
            color-scheme: dark;
            /* Le fond du canvas provient de la couleur de <html> dès que celle-ci
               n'est pas transparente. On force la racine ET le <body> (qui garde
               sa classe bg-[#f8fafc]) pour qu'aucun reliquat clair ne subsiste,
               même pendant la transition de thème. */
            background-color: var(--bg) !important;
        }
        html[data-theme="dark"] body {
            background-color: var(--bg) !important;
        }

        /* --- Raccourcis : transition douce au changement de thème --- */
        @media (prefers-reduced-motion: no-preference) {
            :where(body, .card, .table-wrap, .modal-card, .sidebar, .badge,
                   .app-table thead th, .app-table tbody td) {
                transition: background-color .25s ease, color .25s ease, border-color .25s ease;
            }
        }

        /* --- Composants (via variables de palette) --- */
        html[data-theme="dark"] ::selection { background: rgba(59, 130, 246, .35); }
        html[data-theme="dark"] ::-webkit-scrollbar-thumb { background: #334155; border: 2px solid transparent; background-clip: content-box; }
        html[data-theme="dark"] ::-webkit-scrollbar-thumb:hover { background: #475569; border: 2px solid transparent; background-clip: content-box; }

        html[data-theme="dark"] .card-hover:hover { border-color: #2b3a5c; box-shadow: 0 8px 28px -8px rgba(0, 0, 0, .5); }
        html[data-theme="dark"] .btn-secondary { background: var(--surface); color: #cbd5e1; border-color: #334155; }
        html[data-theme="dark"] .btn-secondary:hover:not(:disabled) { background: #1a2540; border-color: #475569; }
        html[data-theme="dark"] .btn-ghost { color: #94a3b8; }
        html[data-theme="dark"] .btn-ghost:hover:not(:disabled) { background: #1a2540; }
        html[data-theme="dark"] .label { color: #b6c3da; }
        html[data-theme="dark"] .input { background: #0e1626; border-color: #2b3a5c; color: var(--text); }
        html[data-theme="dark"] .input::placeholder { color: #64748b; }
        html[data-theme="dark"] .input:hover { border-color: #475569; }
        html[data-theme="dark"] select.input {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%23cbd5e1'%3e%3cpath fill-rule='evenodd' d='M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z' clip-rule='evenodd'/%3e%3c/svg%3e");
        }
        html[data-theme="dark"] .input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: .6; }

        html[data-theme="dark"] .badge-green { background: rgba(16, 185, 129, .14); color: #34d399; border-color: rgba(16, 185, 129, .4); }

                                        <button x-show="canDeleteDrivers" @click="deleteDriver(d.id)" title="Supprimer" class="btn btn-ghost btn-xs !text-rose-500">
                                            <i class="fa-solid fa-trash-can"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                    <p x-show="drivers.length === 0" class="text-sm text-slate-500 text-center py-10">Aucun conducteur enregistré.</p>
                </div>

                <!-- ========================================== -->
                <!-- VUE : GESTION DES UTILISATEURS (Admin)    -->
                <!-- ========================================== -->
                <div x-show="mainTab === 'users'" class="space-y-6" x-cloak>

                        </button>

                                        <span :class="{
                                            'badge-indigo': u.role === 'ADMIN',
                                            'badge-amber': u.role === 'MANAGER',
                                            'badge-green': u.role === 'DRIVER'

                                </div>
                                <div class="flex items-center gap-1 flex-shrink-0">
                                    <button @click="openUserModal(u)" title="Modifier" class="btn btn-ghost btn-xs !text-slate-500 hover:!text-indigo-600">

                                    <button x-show="u.id !== currentUser.id" @click="deleteUser(u.id)" title="Supprimer" class="btn btn-ghost btn-xs !text-rose-500">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </div>
                            </div>
                        </template>
                        <p x-show="orgUsers.length === 0" class="text-sm text-slate-500 col-span-2 text-center py-10">Aucun utilisateur pour l'instant.</p>
                    </div>
                </div>

                <!-- ========================================== -->
                <!-- VUE 4 : RESERVATIONS & PLANNING           -->
                <!-- ========================================== -->
                <div x-show="mainTab === 'reservations'" class="space-y-6" x-cloak>
                    <div class="flex justify-between items-center animate-fade-up">
                        <div>
                            <h2 class="text-xl font-bold text-slate-900">Planning des Missions</h2>
                            <p class="text-xs text-slate-500">Validation et historique des affectations de véhicules.</p>
                        </div>
                        <button @click="openReservationModal()" class="btn btn-primary">
                            + Faire une Demande
                        </button>
                    </div>

                    <div class="table-wrap shadow-sm">
                        <div class="overflow-x-auto">
                            <table class="app-table min-w-[760px]">
                                <thead>
                                    <tr>
                                        <th>Véhicule</th>
                                        <th>Conducteur</th>
                                        <th>Début</th>
                                        <th>Fin</th>
                                        <th>Motif</th>
                                        <th>Statut</th>
                                        <th class="text-right">Action</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    <template x-for="r in reservations" :key="r.id">
                                        <tr>
                                            <td class="font-semibold text-slate-900" x-text="r.vehicle"></td>
                                            <td x-text="r.driver"></td>
                                            <td class="font-mono text-slate-500 whitespace-nowrap" x-text="r.start"></td>
                                            <td class="font-mono text-slate-500 whitespace-nowrap" x-text="r.end"></td>
                                            <td x-text="r.purpose"></td>
                                            <td>
                                                <span :class="{
                                                    'badge-green': r.status === 'APPROVED',
                                                    'badge-amber': r.status === 'PENDING'
                                                }" class="badge" x-text="r.status === 'APPROVED' ? 'Approuvé' : 'En Attente'"></span>
                                            </td>
                                            <td class="text-right">
                                                <div class="flex items-center justify-end gap-1.5">

                                                        Valider
                                                    </button>
                                                    <button @click="openReservationModal(r)" class="btn btn-ghost btn-xs !text-slate-500 hover:!text-indigo-600">
                                                        <i class="fa-solid fa-pen text-xs"></i>
                                                    </button>
                                                    <button @click="deleteReservation(r.id)" class="btn btn-ghost btn-xs !text-slate-500 hover:!text-rose-500">
                                                        <i class="fa-solid fa-trash-can text-xs"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <p x-show="reservations.length === 0" class="text-sm text-slate-500 text-center py-10">Aucune réservation enregistrée.</p>
                </div>

                <!-- ========================================== -->
                <!-- VUE 5 : ENTRETIEN & CARBURANT             -->
                <!-- ========================================== -->
                <div x-show="mainTab === 'maintenance'" class="space-y-6" x-cloak>
                    <div class="flex justify-between items-center animate-fade-up">
                        <div>
                            <h2 class="text-xl font-bold text-slate-900">Planification & Suivi de Maintenance</h2>
                            <p class="text-xs text-slate-500">Organisez les révisions périodiques, les vidanges et le contrôle du budget entretien.</p>
                        </div>
                        <button @click="openMaintenanceModal()" class="btn btn-primary">
                            + Planifier un Entretien
                        </button>
                    </div>

                    <div class="grid md:grid-cols-2 gap-6">
                        <!-- Tableau des Entretiens -->
                        <div class="card card-pad space-y-4">
                            <h3 class="font-bold text-sm text-slate-900 flex items-center gap-2">
                                <i class="fa-solid fa-wrench text-amber-500"></i> Calendrier d'Entretien & Vidanges
                            </h3>
                            <div class="space-y-3">
                                <template x-for="m in maintenances" :key="m.id">
                                    <div class="card p-3.5 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2 bg-slate-50/60 border-slate-200 card-hover">
                                        <div class="min-w-0">
                                            <h4 class="font-bold text-xs text-slate-900 truncate" x-text="m.vehicle"></h4>
                                            <p class="text-[11px] text-slate-600" x-text="m.type"></p>
                                            <p class="text-[10px] text-slate-500" x-text="'Prestataire: ' + (m.provider || 'Garage partenaire')"></p>
                                            <p class="text-[10px] text-slate-500 font-mono" x-text="'Date: ' + m.date"></p>
                                        </div>
                                        <div class="text-left sm:text-right flex-shrink-0">
                                            <p class="font-mono text-xs font-bold text-indigo-600" x-text="m.cost.toLocaleString() + ' FCFA'"></p>
                                            <span :class="{
                                                'badge-red': m.status === 'URGENT',
                                                'badge-green': m.status === 'EFFECTUÉ',
                                                'badge-indigo': m.status === 'PLANIFIÉ'
                                            }" class="badge" x-text="m.status"></span>
                                            <div class="flex items-center sm:justify-end gap-1 mt-1.5">
                                                <button @click="openMaintenanceModal(m)" class="btn btn-ghost btn-xs !text-slate-500 hover:!text-indigo-600">
                                                    <i class="fa-solid fa-pen text-[10px]"></i>
                                                </button>
                                                <button @click="deleteMaintenance(m.id)" class="btn btn-ghost btn-xs !text-slate-500 hover:!text-rose-500">
                                                    <i class="fa-solid fa-trash-can text-[10px]"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                                <p x-show="maintenances.length === 0" class="text-xs text-slate-500 text-center py-4">Aucun entretien planifié.</p>
                            </div>
                        </div>

                        <!-- Reçus de Carburant -->
                        <div class="card card-pad space-y-4">
                            <div class="flex justify-between items-center">
                                <h3 class="font-bold text-sm text-slate-900 flex items-center gap-2">
                                    <i class="fa-solid fa-gas-pump text-emerald-500"></i> Reçus Carburant récents
                                </h3>
                                <button @click="mainTab = 'fuel'" class="text-[10px] font-bold text-indigo-600 hover:text-indigo-500">Voir tout →</button>
                            </div>
                            <div class="space-y-3">
                                <template x-for="f in filteredFuelLogs.slice(0, 3)" :key="f.id">
                                    <div class="card p-3.5 flex justify-between items-center gap-2 bg-slate-50/60 border-slate-200 card-hover">
                                        <div class="min-w-0">
                                            <h4 class="font-bold text-xs text-slate-900" x-text="f.vehicle"></h4>
                                            <p class="text-[11px] text-slate-500" x-text="f.liters + ' Litres (' + f.mileage + ' km)'"></p>
                                            <p class="text-[10px] text-slate-500 font-mono" x-text="f.date"></p>
                                        </div>
                                        <div class="font-mono text-xs font-bold text-emerald-600 flex-shrink-0" x-text="f.cost.toLocaleString() + ' FCFA'"></div>
                                    </div>
                                </template>
                                <p x-show="fuelLogs.length === 0" class="text-xs text-slate-500 text-center py-2">Aucun plein enregistré.</p>
                                <button @click="openFuelModal()" class="w-full text-center text-[11px] font-bold text-emerald-600 border border-dashed border-emerald-300 rounded-xl py-2 hover:bg-emerald-50 transition">
                                    + Ajouter un plein
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ========================================== -->
                <!-- VUE : GESTION DES CARBURANTS               -->
                <!-- ========================================== -->
                <div x-show="mainTab === 'fuel'" class="space-y-6" x-cloak>
                    <div class="flex justify-between items-center animate-fade-up flex-wrap gap-2">
                        <div>
                            <h2 class="text-xl font-bold text-slate-900">Gestion des Carburants</h2>
                            <p class="text-xs text-slate-500">Suivez les pleins, les dépenses et la consommation de chaque véhicule.</p>
                        </div>
                        <div class="flex items-center gap-2 flex-wrap">
                            <select x-model="fuelStatsPeriod" class="input !w-auto" title="Période des statistiques carburant">
                                <option value="month">Ce mois</option>
                                <option value="prevMonth">Mois précédent</option>
                                <option value="week">Cette semaine</option>
                                <option value="year">Cette année</option>
                                <option value="today">Aujourd'hui</option>
                            </select>
                            <button @click="openFuelModal()" class="btn btn-success">
                                + Ajouter un Plein
                            </button>
                        </div>
                    </div>

                    <!-- Statistiques carburant (données officielles /api/fuel-logs/stats) -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="card card-hover card-pad">
                            <div class="flex items-center justify-between">
                                <p class="text-[10px] text-slate-500 font-semibold uppercase">Dépense Sur La Période</p>
                                <i class="fa-solid fa-money-bill-wave text-indigo-500"></i>
                            </div>
                            <p class="text-lg font-bold text-slate-900 font-mono mt-1" x-text="kpiText('cost', ' FCFA')"></p>
                            <p class="text-[10px] mt-0.5 font-semibold flex items-center gap-1" :class="kpiDeltaClass('cost')" :title="kpiDeltaTitle('cost')">
                                <i class="fa-solid" :class="kpiPct('cost') > 0 ? 'fa-arrow-trend-up' : (kpiPct('cost') < 0 ? 'fa-arrow-trend-down' : 'fa-minus')"></i>
                                <span x-text="kpiDeltaText('cost')"></span>
                                <span class="text-slate-400 font-normal" x-show="kpiPct('cost') != null">vs période préc.</span>
                            </p>
                        </div>
                        <div class="card card-hover card-pad">
                            <div class="flex items-center justify-between">
                                <p class="text-[10px] text-slate-500 font-semibold uppercase">Volume Sur La Période</p>
                                <i class="fa-solid fa-gas-pump text-emerald-500"></i>
                            </div>
                            <p class="text-lg font-bold text-slate-900 font-mono mt-1" x-text="kpiText('liters', ' L', 1)"></p>
                            <p class="text-[10px] mt-0.5 font-semibold flex items-center gap-1" :class="kpiDeltaClass('liters')" :title="kpiDeltaTitle('liters')">
                                <i class="fa-solid" :class="kpiPct('liters') > 0 ? 'fa-arrow-trend-up' : (kpiPct('liters') < 0 ? 'fa-arrow-trend-down' : 'fa-minus')"></i>
                                <span x-text="kpiDeltaText('liters')"></span>
                                <span class="text-slate-400 font-normal" x-show="kpiPct('liters') != null">vs période préc.</span>
                            </p>
                        </div>
                        <div class="card card-hover card-pad">
                            <div class="flex items-center justify-between">
                                <p class="text-[10px] text-slate-500 font-semibold uppercase">Prix Moyen / Litre</p>
                                <i class="fa-solid fa-tags text-amber-500"></i>
                            </div>
                            <p class="text-lg font-bold text-slate-900 font-mono mt-1" x-text="kpiText('avgPricePerLiter', ' FCFA')"></p>
                            <p class="text-[10px] mt-0.5 font-semibold flex items-center gap-1" :class="kpiDeltaClass('avgPricePerLiter')" :title="kpiDeltaTitle('avgPricePerLiter')">
                                <i class="fa-solid" :class="kpiPct('avgPricePerLiter') > 0 ? 'fa-arrow-trend-up' : (kpiPct('avgPricePerLiter') < 0 ? 'fa-arrow-trend-down' : 'fa-minus')"></i>
                                <span x-text="kpiDeltaText('avgPricePerLiter')"></span>
                                <span class="text-slate-400 font-normal" x-show="kpiPct('avgPricePerLiter') != null">vs période préc.</span>
                            </p>
                        </div>
                        <div class="card card-hover card-pad">
                            <div class="flex items-center justify-between">
                                <p class="text-[10px] text-slate-500 font-semibold uppercase">Consommation Moyenne</p>
                                <i class="fa-solid fa-gauge-high text-blue-500"></i>
                            </div>
                            <p class="text-lg font-bold text-slate-900 font-mono mt-1" x-text="kpiText('avgConsumption', ' L/100km', 1)"></p>
                            <p class="text-[10px] mt-0.5 font-semibold flex items-center gap-1" :class="kpiDeltaClass('avgConsumption')" :title="kpiDeltaTitle('avgConsumption')">
                                <i class="fa-solid" :class="kpiPct('avgConsumption') > 0 ? 'fa-arrow-trend-up' : (kpiPct('avgConsumption') < 0 ? 'fa-arrow-trend-down' : 'fa-minus')"></i>
                                <span x-text="kpiDeltaText('avgConsumption')"></span>
                                <span class="text-slate-400 font-normal" x-show="kpiPct('avgConsumption') != null">vs période préc.</span>
                            </p>
                        </div>
                    </div>

                    <!-- Anomalies carburant détectées (source officielle /api/fuel-logs/stats) -->
                    <div class="card card-pad space-y-3">
                        <div class="flex items-center justify-between flex-wrap gap-2">
                            <h3 class="font-bold text-sm text-slate-900 flex items-center gap-2">
                                <i class="fa-solid fa-triangle-exclamation text-amber-500"></i> Anomalies Détectées
                            </h3>
                            <span x-show="!fuelStatsLoading && fuelAnomalies.length > 0" class="badge" :class="fuelAnomalyBadgeClass" x-text="fuelAnomalies.length + ' anomalie(s)'"></span>
                        </div>
                        <div x-show="!fuelStatsLoading && fuelAnomalies.length === 0" class="text-xs text-slate-500 flex items-center gap-2 py-2">
                            <i class="fa-solid fa-circle-check text-emerald-500"></i> Aucune anomalie détectée sur la période.
                        </div>
                        <div x-show="fuelStatsLoading" class="text-xs text-slate-400 py-2">
                            <i class="fa-solid fa-spinner fa-spin mr-1"></i> Analyse des pleins...
                        </div>
                        <div class="space-y-2" x-show="fuelAnomalies.length > 0">
                            <template x-for="an in fuelAnomalies" :key="an.id + '-' + an.type">
                                <div class="card p-3 flex flex-col sm:flex-row justify-between gap-2 bg-slate-50/60 border-slate-200">
                                    <div class="min-w-0">
                                        <div class="flex items-center gap-2 flex-wrap">
                                            <span class="badge" :class="anomalySeverityMeta(an.severity).cls" x-text="anomalySeverityMeta(an.severity).label"></span>
                                            <h4 class="font-bold text-xs text-slate-900 truncate" x-text="an.vehicle"></h4>
                                            <span class="text-[10px] text-slate-400 font-mono" x-text="an.date"></span>
                                        </div>
                                        <p class="text-[11px] text-slate-600 mt-1" x-text="an.reason"></p>
                                    </div>
                                    <div class="text-right sm:flex-shrink-0">
                                        <p class="font-mono text-xs font-bold text-amber-600" x-text="an.value"></p>
                                        <p class="text-[10px] text-slate-400" x-text="anomalyTypeLabel(an.type)"></p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Budget carburant mensuel (source officielle /api/fuel-logs/stats) -->
                    <div class="card card-pad space-y-3">
                        <div class="flex items-center justify-between flex-wrap gap-2">
                            <h3 class="font-bold text-sm text-slate-900 flex items-center gap-2">
                                <i class="fa-solid fa-wallet text-indigo-500"></i> Budget Carburant Mensuel
                            </h3>
                            <div class="flex items-center gap-2 flex-wrap">
                                <span x-show="!fuelStatsLoading && fuelBudget" class="badge" :class="budgetStatusMeta().cls" x-text="budgetStatusMeta().label"></span>
                                <button x-show="canManageFleet" @click="openFuelBudgetModal()" class="btn btn-primary btn-xs">
                                    <i class="fa-solid fa-sliders mr-1"></i> Définir / Modifier
                                </button>
                            </div>
                        </div>

                        <!-- Aucun budget défini pour le mois en cours -->
                        <div x-show="!fuelStatsLoading && fuelBudget && !fuelBudget.hasBudget" class="text-xs text-slate-500 flex items-center gap-2 py-2 flex-wrap">
                            <i class="fa-solid fa-circle-info text-slate-400"></i>
                            <span>Aucun budget défini pour <span class="font-semibold" x-text="fuelBudgetMonthLabel(fuelBudget.month)"></span>.</span>
                            <span x-show="canManageFleet">Définissez un montant pour suivre les dépenses.</span>
                        </div>

                        <!-- Budget actif : prévu / dépensé / restant / utilisation -->
                        <div x-show="!fuelStatsLoading && fuelBudget && fuelBudget.hasBudget" class="space-y-3">
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
                                <div class="card p-3 bg-slate-50/60 border-slate-200">
                                    <p class="text-[10px] text-slate-500 font-semibold uppercase">Budget Prévu</p>
                                    <p class="text-base font-bold text-slate-900 font-mono" x-text="fmtMoney(fuelBudget.amount)"></p>
                                </div>
                                <div class="card p-3 bg-slate-50/60 border-slate-200">
                                    <p class="text-[10px] text-slate-500 font-semibold uppercase">Dépensé</p>
                                    <p class="text-base font-bold text-slate-900 font-mono" x-text="fmtMoney(fuelBudget.spent)"></p>
                                </div>
                                <div class="card p-3 bg-slate-50/60 border-slate-200">
                                    <p class="text-[10px] text-slate-500 font-semibold uppercase" x-text="fuelBudget.remaining < 0 ? 'Dépassement' : 'Restant'"></p>
                                    <p class="text-base font-bold font-mono" :class="fuelBudget.remaining < 0 ? 'text-rose-600' : 'text-emerald-600'" x-text="fmtMoney(Math.abs(fuelBudget.remaining))"></p>
                                </div>
                                <div class="card p-3 bg-slate-50/60 border-slate-200">
                                    <p class="text-[10px] text-slate-500 font-semibold uppercase">Utilisation</p>
                                    <p class="text-base font-bold text-slate-900 font-mono" x-text="fuelBudget.utilization != null ? fuelBudget.utilization.toLocaleString('fr-FR') + ' %' : '—'"></p>
                                </div>
                            </div>
                            <div>
                                <div class="h-2 rounded-full bg-slate-100 overflow-hidden">
                                    <div class="h-full rounded-full transition-all" :class="budgetBarClass()" :style="'width:' + Math.min(fuelBudgetUtilization, 100) + '%'"></div>
                                </div>
                                <p class="text-[10px] text-slate-400 mt-1" x-text="fuelBudget.remaining >= 0 ? 'Il reste ' + fmtMoney(fuelBudget.remaining) + ' sur le budget de ' + fuelBudgetMonthLabel(fuelBudget.month) + '.' : 'Le budget de ' + fuelBudgetMonthLabel(fuelBudget.month) + ' est dépassé de ' + fmtMoney(Math.abs(fuelBudget.remaining)) + '.'"></p>
                            </div>

                        <div class="flex justify-end space-x-2 pt-1">
                            <button @click="closePaymentModal()" class="btn btn-secondary">Annuler</button>
                            <button @click="submitPayment()" :disabled="!paymentProvider || paymentSubmitting" class="btn btn-primary">
                                <i class="fa-solid fa-spinner fa-spin mr-1" x-show="paymentSubmitting"></i>
                                <span x-text="paymentSubmitting ? 'Création du paiement…' : 'Payer ' + fmtPrice(paymentFlow.amount) + ' FCFA'"></span>
                            </button>
                        </div>
                    </div>
                </template>

                <!-- Écran 2 : suivi de la transaction (polling GET /api/payments/:id/check) -->
                <template x-if="paymentFlow.step === 'tracking'">
                    <div class="space-y-4">
                        <!-- États en cours : PENDING / PROCESSING -->
                        <div class="flex flex-col items-center text-center py-4 space-y-2"
                             x-show="['PENDING','PROCESSING'].includes(paymentFlow.status)">
                            <div class="w-14 h-14 rounded-full bg-indigo-50 flex items-center justify-center">
                                <i class="fa-solid fa-circle-notch fa-spin text-xl"
                                   :class="paymentFlow.status === 'PROCESSING' ? 'text-indigo-500' : 'text-amber-500'"></i>
                            </div>
                            <p class="text-sm font-bold text-slate-900" x-text="paymentStatusTitle(paymentFlow.status)"></p>
                            <p class="text-xs text-slate-500"
                               x-text="paymentFlow.status === 'PROCESSING' ? 'Vérification du statut auprès du fournisseur...' : 'En attente de confirmation du paiement...'"></p>
                        </div>

                        <!-- Page de paiement hébergée lancée chez le fournisseur (Orange Money / Wave) -->
                        <div x-show="paymentFlow.launchUrl && ['PENDING','PROCESSING'].includes(paymentFlow.status)"
                             class="rounded-xl bg-indigo-50 border border-indigo-200 p-3 flex items-start gap-2 text-[11px]">
                            <i class="fa-solid fa-arrow-up-right-from-square text-indigo-500 mt-0.5 flex-shrink-0"></i>
                            <div class="flex-1 min-w-0">
                                <p class="font-bold text-slate-900">Paiement <span x-text="paymentProviderLabel(paymentFlow.txn.provider)"></span> en cours</p>
                                <p class="text-slate-600 mt-0.5" x-text="paymentNoticeText()"></p>
                                <button @click="openPaymentPage(paymentFlow.launchUrl)"
                                        class="mt-1.5 inline-flex items-center gap-1 font-bold text-indigo-600 hover:text-indigo-700 transition">
                                    <i class="fa-solid fa-rotate-right"></i> <span x-text="paymentReopenLabel()"></span>
                                </button>
                            </div>
                        </div>

                        <!-- SUCCESS : affichage minimal (le renouvellement SaaS est fait par le backend) -->
                        <div class="flex flex-col items-center text-center py-4 space-y-2" x-show="paymentFlow.status === 'SUCCESS'">
                            <div class="w-14 h-14 rounded-full bg-emerald-50 flex items-center justify-center">
                                <i class="fa-solid fa-check text-emerald-600 text-xl"></i>
                            </div>
                            <p class="text-sm font-bold text-emerald-600">Paiement réussi. Votre abonnement sera mis à jour.</p>
                        </div>

                        <!-- États terminaux non réussis : FAILED / CANCELLED / EXPIRED / REFUNDED -->
                        <div class="flex flex-col items-center text-center py-4 space-y-2"
                             x-show="['FAILED','CANCELLED','EXPIRED','REFUNDED'].includes(paymentFlow.status)">
                            <div class="w-14 h-14 rounded-full flex items-center justify-center"
                                 :class="paymentFlow.status === 'REFUNDED' ? 'bg-sky-50' : 'bg-rose-50'">
                                <i class="fa-solid text-xl"
                                   :class="{
                                       'fa-xmark text-rose-600': paymentFlow.status === 'FAILED',
                                       'fa-ban text-rose-600': paymentFlow.status === 'CANCELLED',
                                       'fa-clock text-amber-600': paymentFlow.status === 'EXPIRED',
                                       'fa-rotate-left text-sky-600': paymentFlow.status === 'REFUNDED'
                                   }"></i>
                            </div>
                            <p class="text-sm font-bold text-slate-900" x-text="paymentStatusTitle(paymentFlow.status)"></p>
                        </div>

                        <!-- Détails de la transaction (cachés sur SUCCESS : affichage minimal) -->
                        <div class="rounded-xl border border-slate-200 divide-y divide-slate-100 text-xs overflow-hidden"
                             x-show="paymentFlow.status !== 'SUCCESS'">
                            <div class="flex items-center justify-between px-3 py-2">
                                <span class="text-slate-500">Référence de transaction</span>
                                <span class="font-mono font-bold text-slate-900 text-[11px]" x-text="paymentFlow.txn.transactionReference"></span>
                            </div>
                            <div class="flex items-center justify-between px-3 py-2">
                                <span class="text-slate-500">Fournisseur</span>
                                <span class="font-bold text-slate-900" x-text="paymentProviderLabel(paymentFlow.txn.provider)"></span>
                            </div>
                            <div class="flex items-center justify-between px-3 py-2">
                                <span class="text-slate-500">Montant</span>
                                <span class="font-bold text-slate-900" x-text="fmtPrice(paymentFlow.txn.amount) + ' ' + (paymentFlow.txn.currency || 'XOF')"></span>
                            </div>
                            <div class="flex items-center justify-between px-3 py-2">
                                <span class="text-slate-500">Statut</span>
                                <span class="badge" :class="paymentStatusBadgeClass(paymentFlow.status)">
                                    <span x-text="paymentFlow.status"></span>
                                </span>
                            </div>
                        </div>

                        <!-- Erreur rencontrée pendant le suivi ou l'annulation -->
                        <p x-show="paymentError" class="text-[11px] text-rose-600 flex items-start gap-1.5 rounded-lg bg-rose-50 border border-rose-200 p-2.5">
                            <i class="fa-solid fa-triangle-exclamation mt-0.5 flex-shrink-0"></i><span x-text="paymentError"></span>
                        </p>

                        <!-- Actions -->
                        <div class="flex justify-end space-x-2 pt-1">
                            <!-- Annuler le paiement (PENDING / PROCESSING uniquement) -->
                            <button x-show="['PENDING','PROCESSING'].includes(paymentFlow.status)"
                                    @click="cancelPayment()" :disabled="paymentFlow.canceling"
                                    class="btn btn-secondary">
                                <i class="fa-solid fa-circle-notch fa-spin mr-1" x-show="paymentFlow.canceling"></i>
                                <span x-text="paymentFlow.canceling ? 'Annulation...' : 'Annuler le paiement'"></span>
                            </button>
                            <!-- Réessayer (FAILED / CANCELLED / EXPIRED) : retour au choix du fournisseur -->
                            <button x-show="['FAILED','CANCELLED','EXPIRED'].includes(paymentFlow.status)"
                                    @click="retryPayment()" class="btn btn-secondary">
                                <i class="fa-solid fa-rotate-right mr-1"></i> Réessayer
                            </button>
                            <button @click="closePaymentModal()" class="btn btn-primary">
                                <i class="fa-solid fa-check mr-1"></i> Fermer
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- MODALE : AJOUT VÉHICULE -->
        <div x-show="showVehicleModal" class="modal-backdrop" x-cloak>
            <div class="modal-card p-6 space-y-4">
                <div class="flex items-center justify-between">

                </div>
                <div class="space-y-3 text-xs">
                    <div>

                    </div>
                    <div>
                        <label class="label">Immatriculation</label>
                        <input type="text" x-model="newVehicle.plate" placeholder="ex: DK-994-AZ" class="input">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="label">Marque</label>
                            <input type="text" x-model="newVehicle.brand" placeholder="ex: Toyota" class="input">
                        </div>
                        <div>
                            <label class="label">Modèle</label>
                            <input type="text" x-model="newVehicle.model" placeholder="ex: Corolla" class="input">

                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="label">Année</label>
                            <input type="number" x-model="newVehicle.year" class="input">

                        <div>
                            <label class="label">Km Actuel</label>
                            <input type="number" x-model="newVehicle.mileage" placeholder="0" class="input">

                    <div class="pt-2 border-t border-slate-200">

                        <div class="grid grid-cols-1 gap-2">
                            <div>
                                <label class="label">Date d'Expiration Assurance</label>
                                <input type="date" x-model="newVehicle.insuranceExpiry" class="input">
                            </div>
                            <div>
                                <label class="label">Date de Validité Carte Grise</label>
                                <input type="date" x-model="newVehicle.registrationExpiry" class="input">
                            </div>
                            <div>
                                <label class="label">Date d'Expiration Contrôle Technique</label>
                                <input type="date" x-model="newVehicle.technicalControlExpiry" class="input">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex justify-end space-x-2 pt-2">
                    <button @click="showVehicleModal = false" class="btn btn-secondary">Annuler</button>
                    <button @click="addVehicleSubmit()" class="btn btn-primary" x-text="editingVehicleId ? 'Enregistrer les Modifications' : 'Enregistrer'"></button>
                </div>

                    <div class="space-y-5">

                                <div class="w-16 h-16 rounded-2xl bg-slate-100 border border-slate-200 overflow-hidden flex items-center justify-center flex-shrink-0">

                                </div>
                                <div class="min-w-0">
                                    <h3 class="text-lg font-bold text-slate-900 truncate" x-text="selectedVehicleDetail.brand + ' ' + selectedVehicleDetail.model"></h3>
                                    <p class="text-xs text-slate-500 font-mono mt-1" x-text="selectedVehicleDetail.plate + ' — ' + selectedVehicleDetail.year + ' — ' + selectedVehicleDetail.mileage.toLocaleString() + ' km'"></p>
                                    <p class="text-xs text-slate-500 mt-0.5">Conducteur assigné : <span class="text-slate-800 font-medium" x-text="selectedVehicleDetail.driver"></span></p>
                                </div>
                            </div>
                            <button @click="showVehicleDetailModal = false" class="text-slate-400 hover:text-slate-700 p-2 rounded-xl hover:bg-slate-100 transition flex-shrink-0">
                                <i class="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>

                        <!-- Statuts documents & vidange -->
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-[11px]">
                            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                                <p class="text-slate-600 font-semibold mb-1"><i class="fa-solid fa-oil-can"></i> Vidange</p>

                            </div>
                            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                                <p class="text-slate-600 font-semibold mb-1"><i class="fa-solid fa-shield-halved"></i> Assurance</p>
                                <p :class="'text-' + getDocumentStatus(selectedVehicleDetail.insuranceExpiry).color + '-500'" class="font-mono font-bold" x-text="getDocumentStatus(selectedVehicleDetail.insuranceExpiry).label"></p>
                            </div>
                            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                                <p class="text-slate-600 font-semibold mb-1"><i class="fa-solid fa-file-lines"></i> Carte Grise</p>

                                <p class="text-[10px] text-emerald-600 font-semibold uppercase">Total Carburant</p>
                                <p class="text-sm font-bold text-slate-900 font-mono" x-text="vehicleDetailTotalFuelCost.toLocaleString() + ' FCFA'"></p>
                            </div>
                            <div class="bg-rose-50 border border-rose-100 p-3 rounded-xl text-center">
                                <p class="text-[10px] text-rose-600 font-semibold uppercase">Total Sinistres</p>
                                <p class="text-sm font-bold text-slate-900 font-mono" x-text="vehicleDetailTotalAccidentCost.toLocaleString() + ' FCFA'"></p>

                                        <span class="text-emerald-600 font-mono font-bold" x-text="f.cost.toLocaleString() + ' FCFA'"></span>

                            <div class="space-y-1.5 max-h-40 overflow-y-auto pr-1">
                                <template x-for="i in vehicleDetailIncidents" :key="i.id">

                                        <div>
                                            <p class="text-slate-800 font-medium" x-text="i.title"></p>
                                            <p class="text-slate-500 font-mono" x-text="i.date + ' — ' + i.driver"></p>

                                <p x-show="vehicleDetailAccidents.length === 0" class="text-[11px] text-slate-500 text-center py-2">Aucun accident enregistré.</p>

                        </div>

                        <div class="flex justify-end pt-2">
                            <button @click="showVehicleDetailModal = false" class="btn btn-secondary">Fermer</button>

                </div>
                <div class="space-y-3 text-xs">

                            <div class="w-16 h-16 rounded-full bg-slate-100 border border-slate-200 overflow-hidden flex items-center justify-center flex-shrink-0">

                            <div class="flex-1 space-y-1">
                                <input type="file" accept="image/*" @change="handlePhotoUpload($event, 'driver')" class="w-full text-[10px] text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-indigo-600 file:text-white file:text-[10px] file:font-bold hover:file:bg-indigo-500 file:cursor-pointer cursor-pointer">

                    <div>

                    </div>
                    <div>
                        <label class="label">Téléphone</label>
                        <input type="text" x-model="newDriver.phone" placeholder="ex: +221 77 000 00 00" class="input">
                    </div>
                    <div>
                        <label class="label">Numéro de Permis de Conduire</label>
                        <input type="text" x-model="newDriver.license" placeholder="ex: B-993021" class="input">
                    </div>
                    <div>
                        <label class="label">Date d'Expiration du Permis</label>
                        <input type="date" x-model="newDriver.licenseExpiry" class="input">
                    </div>

    <!-- Paramètres : état local + préférences persistées (localStorage).
         Aucune modification de app.js : les réglages sont autonomes. -->
    <script>
        function settingsState() {
            function get(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
            function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
            function notifDef() {
                return {
                    general: get('asadiya-notif-general', '1') === '1',
                    maintenance: get('asadiya-notif-maintenance', '1') === '1',
                    vehicle: get('asadiya-notif-vehicle', '1') === '1',
                    documents: get('asadiya-notif-documents', '1') === '1',
                    subscription: get('asadiya-notif-subscription', '1') === '1',
                    important: true
                };
            }
            return {
                themeMode: window.getThemeMode(),
                density: window.getDensity(),
                notif: notifDef(),
                rowsPerTable: get('asadiya-rows-per-table', '10'),
                lang: get('asadiya-lang', 'fr'),
                pw: { current: '', next: '', confirm: '' },
                pwError: '',
                pwOk: false,

                setThemeMode(m) { window.setTheme(m); this.themeMode = m; },
                setDensity(d) { window.setDensity(d); this.density = d; },
                toggleNotif(k) {
                    this.notif[k] = !this.notif[k];
                    set('asadiya-notif-' + k, this.notif[k] ? '1' : '0');
                },
                setRows(v) { this.rowsPerTable = v; set('asadiya-rows-per-table', v); },
                setLang(l) { this.lang = l; set('asadiya-lang', l); },

                changePassword() {
                    this.pwError = '';
                    this.pwOk = false;
                    if (!this.pw.current) { this.pwError = 'Veuillez renseigner votre mot de passe actuel.'; return; }
                    if (this.pw.next.length < 6) { this.pwError = 'Le nouveau mot de passe doit contenir au moins 6 caractères.'; return; }
                    if (this.pw.next !== this.pw.confirm) { this.pwError = 'Les deux mots de passe ne correspondent pas.'; return; }
                    if (this.pw.next === this.pw.current) { this.pwError = 'Le nouveau mot de passe doit être différent du mot de passe actuel.'; return; }
                    this.pwOk = true;
                    this.pw = { current: '', next: '', confirm: '' };
                }
            };
        }
    </script>
